# Kustomize entry point: `kubectl apply -k k8s/` applies the whole stateful
# backbone as one unit, all pinned to the `crypto` namespace.
#
# This covers the stateful backbone (Kafka + MinIO). The app services (producer,
# Spark, serving, dashboard) live in `k8s/apps/` and are layered on top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crypto

resources:
  - namespace.yaml
  - minio-secret.yaml
  - minio.yaml
  - minio-buckets-job.yaml
  - kafka.yaml
  - kafka-topic-job.yaml
