# MinIO credentials. In Compose these were inline env literals; on K8s they move
# into a Secret — the right home for credentials (mountable, RBAC-scoped, and
# swappable for a real secret store like Sealed Secrets / External Secrets).
#
# These are LOCAL-DEV values only. `stringData` lets us write them in plain text;
# K8s base64-encodes them on write. For a real deployment these come from a
# secret manager, never a committed file.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  labels:
    app: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  # Full mc connection alias, so the bucket-creation Job needs no shell to build
  # a URL from parts (the Chainguard mc image is shell-less).
  MC_HOST_local: http://minioadmin:minioadmin@minio:9000
