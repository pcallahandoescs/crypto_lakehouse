# Batch medallion run: silver -> gold -> data-quality, as one sequential Job.
# This is the K8s equivalent of the Airflow batch DAG (Airflow itself isn't
# migrated to K8s here). Each step is a separate spark-submit chained with `&&`,
# so a failure stops the run.
#
# NOT part of the apps kustomization on purpose: it reads the bronze table, so it
# should run only AFTER the bronze stream has landed some data. Run it on demand:
#
#     kubectl -n crypto delete job spark-batch-pipeline --ignore-not-found
#     kubectl -n crypto apply -f k8s/apps/spark-batch-job.yaml
#     kubectl -n crypto logs -f job/spark-batch-pipeline
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-batch-pipeline
  labels:
    app: spark
    job: batch-pipeline
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: spark
        job: batch-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: batch
          image: crypto-lakehouse-spark:3.5.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              SUBMIT="/opt/spark/bin/spark-submit --master local[*] --driver-memory 2g"
              echo ">>> silver_batch"; $SUBMIT silver_batch.py
              echo ">>> gold_aggregate"; $SUBMIT gold_aggregate.py
              echo ">>> dq_validate"; $SUBMIT dq_validate.py
              echo ">>> batch pipeline complete"
          envFrom:
            - configMapRef:
                name: lakehouse-config
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
