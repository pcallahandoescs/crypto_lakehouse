# Serving API — FastAPI over gold via delta-rs. Stateless -> Deployment.
# Exposed on a NodePort so it's reachable from the laptop at localhost:8000
# (kind maps hostPort 8000 -> nodePort 30800 in kind-cluster.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  labels:
    app: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: crypto-lakehouse-serving:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: GOLD_BASE_URI
              value: "s3://gold"
            - name: PRODUCTS
              value: "BTC-USD,ETH-USD"
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  labels:
    app: serving
spec:
  type: NodePort
  selector:
    app: serving
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
