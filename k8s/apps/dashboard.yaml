# Dashboard — Streamlit UI over the serving API. Stateless -> Deployment.
# Exposed on a NodePort -> localhost:8501 (kind maps hostPort 8501 -> 30850).
# Talks to the serving API by its in-cluster Service name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: crypto-lakehouse-dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: API_BASE_URL
              value: "http://serving:8000"
          ports:
            - name: http
              containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30850
