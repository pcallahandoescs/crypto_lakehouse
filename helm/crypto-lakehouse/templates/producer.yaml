{{- if .Values.producer.enabled }}
# Producer — Coinbase WebSocket -> Kafka. Stateless long-lived service, so a
# Deployment: a dead pod is replaced and reconnects to the stream on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    app: producer
    {{- include "crypto-lakehouse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.producer.replicas }}
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: {{ .Values.producer.image | quote }}
          imagePullPolicy: {{ .Values.producer.imagePullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.config.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.config.kafkaTopic | quote }}
            - name: PRODUCTS
              value: {{ .Values.config.products | quote }}
          resources:
            {{- toYaml .Values.producer.resources | nindent 12 }}
{{- end }}
