# MinIO — S3-compatible object storage, the lakehouse STORAGE layer. Modeled as
# a StatefulSet: it owns durable state and needs a stable identity (minio-0) plus
# a per-pod PVC that survives rescheduling.
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  labels:
    app: minio
    {{- include "crypto-lakehouse.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
    - name: console
      port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
    {{- include "crypto-lakehouse.labels" . | nindent 4 }}
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app: minio
    {{- include "crypto-lakehouse.labels" . | nindent 4 }}
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # fsGroup makes the mounted volume group-writable so MinIO can write /data.
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: {{ include "crypto-lakehouse.secretName" . }}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          {{- if .Values.probes.enabled }}
          # httpGet probes are run by the kubelet (no in-container shell needed),
          # so they work on the shell-less Chainguard image.
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 20
            failureThreshold: 6
          {{- end }}
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage | quote }}
