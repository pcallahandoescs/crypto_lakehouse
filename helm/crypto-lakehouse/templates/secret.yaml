{{- if not .Values.credentials.existingSecret }}
# MinIO credentials. LOCAL-DEV values only (from values.yaml). For real
# deployments set credentials.existingSecret to a Secret from your secret store
# (Sealed Secrets / External Secrets) and this template is skipped entirely.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  labels:
    app: minio
    {{- include "crypto-lakehouse.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.credentials.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.credentials.minioRootPassword | quote }}
  # Full mc connection alias so the shell-less Chainguard mc image needs no
  # URL assembly in the bucket-creation Job.
  MC_HOST_local: {{ printf "http://%s:%s@minio:9000" .Values.credentials.minioRootUser .Values.credentials.minioRootPassword | quote }}
{{- end }}
